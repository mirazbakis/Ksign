      # ----- Build the .app directly (NO signing, NO archive) ----
      - name: Build .app (Unsigned)
        run: |
          xcodebuild build \
            -project Ksign.xcodeproj \
            -scheme Ksign \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=""

      # ----- Manually create .ipa from the built .app -----
      - name: Create .ipa manually
        run: |
          APP_PATH=$(find ./build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r XSign-unsigned.ipa Payload/
